openapi: "3.0.3"
info:
  title: "Sample Widget API"
  version: "1.0.0"
paths:
  /widgets/{id}:
    get:
      operationId: "get_widget"
      summary: "Get a widget by id"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
